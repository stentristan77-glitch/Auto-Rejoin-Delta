name: Build Bee Macro
on:
  push:
    paths:
      - "BeeMacro.zip"
      - ".github/workflows/beemacro.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o BeeMacro.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle assembleDebug
        working-directory: BeeMacro
      - uses: actions/upload-artifact@v4
        with:
          name: BeeMacro-apk
          path: BeeMacro/app/build/outputs/apk/debug/app-debug.apk
